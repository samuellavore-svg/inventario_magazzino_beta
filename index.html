d var(--line);border-radius:12px;margin:8px 0;overflow:hidden;background:#102039}.accbtn{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;border-radius:0;background:transparent;padding:13px}.accbody{padding:0 11px 10px}.item{border-top:1px solid var(--line);padding:10px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:9px;width:100%;background:transparent;border:0;text-align:left;padding:8px 2px}.itemdetails{padding:10px 5px 6px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;background:#25405c;border-radius:8px;padding:3px 7px;color:#d7e7f8}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.qty{display:flex;gap:9px;align-items:center;justify-content:flex-end}.qty button{min-width:40px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.empty{padding:20px;color:var(--muted);text-align:center}.line{border-top:1px solid var(--line);margin:12px 0}.orderline{padding:10px 0;border-top:1px solid var(--line)}.mini{padding:6px 9px;font-size:12px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.hide{display:none!important}.footer{color:var(--muted);font-size:12px;margin-top:25px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23547b;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:3;display:none;max-width:90vw}.twocol{display:grid;grid-template-columns:1fr;gap:12px}.bar{height:9px;background:#2d4158;border-radius:10px;overflow:hidden;margin-top:5px}.bar>div{height:100%;background:var(--accent)}.tag{font-size:11px;padding:3px 7px;border-radius:8px;background:#29405a}.desktop .shell{max-width:1450px}.desktop .twocol{grid-template-columns:1.2fr .8fr}.desktop .cards{grid-template-columns:repeat(3,1fr)}.desktop .section{padding:20px}.desktop .itemdetails{display:flex;justify-content:space-between;align-items:center;gap:12px}.desktop .searchrow{grid-template-columns:1fr 190px}@media(min-width:850px){body:not(.mobile) .twocol{grid-template-columns:1.2fr .8fr}body:not(.mobile) .shell{max-width:1350px}}@media(max-width:430px){.brand{font-size:18px}.shell{padding:13px 10px 75px}.searchrow{grid-template-columns:1fr}.toolbar button{min-width:90px}.cards .card{padding:10px}.cards strong{font-size:22px}.fields{grid-template-columns:1fr}.desktop .shell{min-width:900px}.desktop{overflow-x:auto}.desktop .cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body class="mobile"><div class="shell"><header class="header"><div><div class="brand">✦ Inventario Padre Pio <span class="pill">BETA PRIVATA</span></div><div class="subtitle">Prototipo locale • Nessun collegamento a Firebase</div></div><div class="row"><button id="viewBtn" onclick="switchView()">🖥️ Vista desktop</button><button onclick="resetDemo()">↻ Ripristina demo</button></div></header><nav class="toolbar" id="nav"></nav><main id="main"></main><div class="footer">Versione di prova offline. Le modifiche vengono salvate solo in questo browser. Nessuna giacenza del gestionale ufficiale viene modificata.</div></div><div class="toast" id="toast"></div><script>
'use strict';
const KEY='padrepio_beta_v1';
const demo=()=>({materials:[
{id:'m1',cat:'CASSE',sub:'Classiche',name:'Cassa Roma',color:'Noce',variant:'Standard',qty:2,min:4,unit:'pz'},
{id:'m2',cat:'CASSE',sub:'Classiche',name:'Cassa Roma',color:'Bianco',variant:'Standard',qty:5,min:3,unit:'pz'},
{id:'m3',cat:'CASSE',sub:'Pregiate',name:'Cassa Milano',color:'Rovere',variant:'Premium',qty:0,min:2,unit:'pz'},
{id:'m4',cat:'ACCESSORI',sub:'Maniglie',name:'Maniglie ottone',color:'Oro',variant:'Set',qty:3,min:6,unit:'set'},
{id:'m5',cat:'ACCESSORI',sub:'Croci',name:'Croce decorativa',color:'Argento',variant:'Piccola',qty:12,min:5,unit:'pz'},
{id:'m6',cat:'TESSUTI',sub:'Rivestimenti',name:'Imbottitura',color:'Bianco',variant:'Standard',qty:4,min:6,unit:'pz'},
{id:'m7',cat:'TESSUTI',sub:'Rivestimenti',name:'Velo',color:'Nero',variant:'Lungo',qty:10,min:3,unit:'pz'},
{id:'m8',cat:'ACCESSORI',sub:'Maniglie',name:'Maniglie cromate',color:'Argento',variant:'Set',qty:8,min:4,unit:'set'}],orders:{},history:[{id:'h1',date:'2026-10-20',service:'Servizio dimostrativo A',lines:[{id:'m1',name:'Cassa Roma · Noce',qty:2},{id:'m4',name:'Maniglie ottone',qty:1}]},{id:'h2',date:'2026-10-21',service:'Servizio dimostrativo B',lines:[{id:'m1',name:'Cassa Roma · Noce',qty:1},{id:'m6',name:'Imbottitura',qty:2}]}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||demo();if(!Array.isArray(db.materials)||!Array.isArray(db.history))throw 0}catch{db=demo()};let tab='inventario',filter='all',query='',expanded=new Set(),serviceCart={},orderExpanded=new Set();const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),alpha=(a,b)=>a.localeCompare(b,'it',{sensitivity:'base',numeric:true}),stock=x=>x.qty===0?'bad':x.qty<x.min?'warn':'good',status=x=>x.qty===0?'Esaurito':x.qty<x.min?'Scorta bassa':'Disponibile',sortm=(a,b)=>alpha(a.name,b.name)||alpha(a.color,b.color)||alpha(a.variant,b.variant);function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}render()}function notify(msg){const e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>e.style.display='none',2700)}function switchView(){document.body.classList.toggle('desktop');document.body.classList.toggle('mobile');$('viewBtn').textContent=document.body.classList.contains('desktop')?'📱 Vista telefono':'🖥️ Vista desktop'}function resetDemo(){if(confirm('Ripristinare i dati dimostrativi? Le modifiche fatte in questa beta verranno perse.')){db=demo();expanded.clear();serviceCart={};save();notify('Demo ripristinata')}}function changeTab(t){tab=t;expanded.clear();render()}function nav(){return [['inventario','📦 Inventario'],['ordini','🛒 Ordini'],['servizi','📋 Scarico servizio'],['statistiche','📊 Statistiche'],['gestione','⚙️ Gestione']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="changeTab('${k}')">${v}</button>`).join('')}function stats(){return `<div class="cards"><div class="card"><small>Materiali</small><strong>${db.materials.length}</strong><small>Varianti censite</small></div><div class="card"><small>Da ordinare</small><strong class="warn">${db.materials.filter(x=>x.qty<x.min).length}</strong><small>Sotto minimo</small></div><div class="card"><small>Esauriti</small><strong class="bad">${db.materials.filter(x=>x.qty===0).length}</strong><small>Giacenza zero</small></div></div>`}function catsFor(arr){return [...new Set(arr.map(x=>x.cat))].sort(alpha)}function toggle(k){expanded.has(k)?expanded.delete(k):expanded.add(k);render()}function qty(id,d){const x=db.materials.find(x=>x.id===id);if(!x)return;if(x.qty+d<0)return notify('Giacenza già a zero');x.qty+=d;save()}function materialItem(x,mode='inventory'){const key='m:'+x.id,opened=expanded.has(key);return `<div class="item"><button class="itemhead" onclick="toggle('${key}')"><span>${opened?'▾':'▸'} <b>${esc(x.name)}</b> <span class="chip">${esc(x.color||x.variant||'Standard')}</span></span><span class="${stock(x)} small">${x.qty} ${esc(x.unit)} · ${status(x)}</span></button>${opened?`<div class="itemdetails"><div class="chips"><span class="chip">${esc(x.variant||'Senza variante')}</span><span class="chip">${esc(x.sub||'Generale')}</span><span class="chip">Minimo ${x.min}</span></div><div class="qty"><button onclick="qty('${x.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="qty('${x.id}',1)">+</button><button class="mini" onclick="editItem('${x.id}')">Modifica</button></div></div>`:''}</div>`}function inventory(){let a=db.materials.filter(x=>{const t=[x.name,x.cat,x.sub,x.color,x.variant].join(' ').toLowerCase();return t.includes(query.toLowerCase())&&(filter==='all'||(filter==='zero'?x.qty===0:filter==='low'?x.qty<x.min:x.qty>=x.min))}).sort(sortm);return `${stats()}<section class="section"><h2>Magazzino</h2><div class="searchrow"><input aria-label="Cerca materiali" placeholder="🔎 Cerca materiale, categoria, colore..." value="${esc(query)}" oninput="query=this.value;renderKeepFocus(this)"><select onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>Tutti i materiali</option><option value="low" ${filter==='low'?'selected':''}>Da ordinare</option><option value="zero" ${filter==='zero'?'selected':''}>Esauriti</option><option value="ok" ${filter==='ok'?'selected':''}>Disponibili</option></select></div>${a.length?catsFor(a).map(c=>{const k='c:'+c,open=expanded.has(k),cc=a.filter(x=>x.cat===c);return `<div class="accordion"><button class="accbtn" onclick="toggle('${k}')"><b>${open?'▾':'▸'} ${esc(c)}</b><span class="muted small">${cc.length} materiali</span></button>${open?`<div class="accbody">${[...new Set(cc.map(x=>x.sub||'Generale'))].sort(alpha).map(s=>{const sk=k+':'+s,ss=cc.filter(x=>(x.sub||'Generale')===s);return `<div class="accordion"><button class="accbtn" onclick="toggle('${sk}')"><span>${expanded.has(sk)?'▾':'▸'} ${esc(s)}</span><span class="muted small">${ss.length}</span></button>${expanded.has(sk)?`<div class="accbody">${ss.map(x=>materialItem(x)).join('')}</div>`:''}</div>`}).join('')}</div>`:''}</div>`}).join(''):'<div class="empty">Nessun materiale trovato</div>'}</section>`}function renderKeepFocus(el){const p=el.selectionStart;render();const n=document.querySelector('input[aria-label="Cerca materiali"]');if(n){n.focus();n.setSelectionRange(p,p)}}function editItem(id){const x=db.materials.find(x=>x.id===id);if(!x)return;const name=prompt('Nome materiale',x.name);if(name===null||!name.trim())return;const color=prompt('Colore',x.color);if(color===null)return;const variant=prompt('Variante',x.variant);if(variant===null)return;const min=prompt('Giacenza minima',x.min);if(min===null)return;x.name=name.trim();x.color=color.trim();x.variant=variant.trim();x.min=Math.max(0,Math.floor(Number(min)||0));save();notify('Materiale aggiornato')}function addItem(){const cat=prompt('Categoria (es. CASSE)');if(!cat?.trim())return;const sub=prompt('Sottocategoria','Generale');if(sub===null)return;const name=prompt('Nome materiale');if(!name?.trim())return;const color=prompt('Colore','');if(color===null)return;const variant=prompt('Variante','');if(variant===null)return;const qty=prompt('Giacenza iniziale','0');if(qty===null)return;const min=prompt('Giacenza minima','3');if(min===null)return;db.materials.push({id:'m'+Date.now().toString(36),cat:cat.trim().toUpperCase(),sub:sub.trim()||'Generale',name:name.trim(),color:color.trim(),variant:variant.trim(),qty:Math.max(0,Math.floor(Number(qty)||0)),min:Math.max(0,Math.floor(Number(min)||0)),unit:'pz'});save();notify('Materiale aggiunto')}function removeItem(id){const x=db.materials.find(x=>x.id===id);if(x&&confirm('Eliminare '+x.name+' dalla beta?')){db.materials=db.materials.filter(x=>x.id!==id);save()}}
function orderItem(x){const k='o:'+x.id,o=orderExpanded.has(k),s=db.orders[x.id]||'Da ordinare';return `<div class="orderline"><button class="itemhead" onclick="orderExpanded.has('${k}')?orderExpanded.delete('${k}'):orderExpanded.add('${k}');render()"><span>${o?'▾':'▸'} <b>${esc(x.name)}</b> <span class="chip">${esc(x.color||x.variant||'Standard')}</span></span><span class="${stock(x)} small">${x.qty} rimasti</span></button>${o?`<div class="itemdetails"><div><div class="muted small">${esc(x.sub)} · ${esc(x.variant)} · Minimo ${x.min} ${esc(x.unit)}</div><div class="bad">Giacenza attuale: ${x.qty} ${esc(x.unit)}</div></div><div><label>Stato ordine</label><select onchange="db.orders['${x.id}']=this.value;save()">${['Da ordinare','Ordinato','Ricevuto'].map(v=>`<option ${v===s?'selected':''}>${v}</option>`).join('')}</select><button class="mini primary" style="margin-top:6px" onclick="receive('${x.id}')">Registra ricezione</button></div></div>`:''}</div>`}function receive(id){const x=db.materials.find(x=>x.id===id);if(!x)return;const v=prompt('Quanti pezzi sono arrivati?',String(Math.max(1,x.min-x.qty)));if(v===null)return;const n=Math.floor(Number(v));if(!Number.isFinite(n)||n<=0)return notify('Inserisci una quantità valida');if(!confirm(`Aggiungere ${n} ${x.unit} a ${x.name}?`))return;x.qty+=n;db.orders[id]='Ricevuto';save();notify('Ricezione registrata')}function orders(){const a=db.materials.filter(x=>x.qty<x.min).sort(sortm);return `<section class="section"><div class="row wrap"><h2>Riepilogo ordini</h2><button onclick="exportCsv()">⬇ Esporta CSV</button></div><p class="muted small">Le categorie e i materiali sono a tendina. Puoi segnare un articolo come ordinato e registrare l'arrivo della merce.</p>${a.length?catsFor(a).map(c=>{const k='oc:'+c,cc=a.filter(x=>x.cat===c);return `<div class="accordion"><button class="accbtn" onclick="toggle('${k}')"><b>${expanded.has(k)?'▾':'▸'} ${esc(c)}</b><span class="warn small">${cc.length} da ordinare</span></button>${expanded.has(k)?`<div class="accbody">${cc.map(orderItem).join('')}</div>`:''}</div>`}).join(''):'<div class="empty good">Tutte le giacenze sono sopra il minimo.</div>'}</section>`}function cartSet(id,v){serviceCart[id]=Math.max(0,Math.floor(Number(v)||0));render()}function service(){const sorted=[...db.materials].sort(sortm),selected=Object.entries(serviceCart).filter(([id,n])=>n>0),total=selected.reduce((a,[id,n])=>a+n,0);return `<section class="section"><h2>Scarico rapido per servizio</h2><p class="muted small">Seleziona più materiali, indica le quantità e conferma una sola volta. Tutti gli scarichi alimentano le statistiche dei materiali più utilizzati.</p><div class="fields"><div class="full"><label>Riferimento servizio (facoltativo)</label><input id="serviceName" placeholder="Es. Servizio 24 ottobre"></div></div><div class="tablewrap"><table><thead><tr><th>Materiale</th><th>Disponibili</th><th>Da scaricare</th></tr></thead><tbody>${sorted.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.cat)} · ${esc(x.color)} ${esc(x.variant)}</div></td><td>${x.qty}</td><td><input style="max-width:95px" type="number" min="0" max="${x.qty}" value="${serviceCart[x.id]||0}" onchange="cartSet('${x.id}',this.value)"></td></tr>`).join('')}</tbody></table></div><div class="row wrap" style="margin-top:14px"><b>${total} unità selezionate</b><button class="primary" onclick="commitService()">Conferma scarico</button></div></section>`}function commitService(){const lines=Object.entries(serviceCart).filter(([id,n])=>n>0).map(([id,n])=>({x:db.materials.find(x=>x.id===id),n}));if(!lines.length)return notify('Seleziona almeno un materiale');if(lines.some(({x,n})=>!x||n>x.qty))return notify('Quantità superiore alla giacenza disponibile');const name=$('serviceName')?.value.trim()||'Servizio senza nome';if(!confirm(`Scaricare ${lines.reduce((a,z)=>a+z.n,0)} unità per "${name}"?`))return;lines.forEach(({x,n})=>x.qty-=n);db.history.unshift({id:'h'+Date.now(),date:new Date().toISOString().slice(0,10),service:name,lines:lines.map(({x,n})=>({id:x.id,name:x.name+(x.color?' · '+x.color:''),qty:n}))});serviceCart={};save();notify('Scarico registrato nello storico')}
function usage(){const map=new Map();for(const h of db.history)for(const l of h.lines){const old=map.get(l.id)||{id:l.id,name:l.name,qty:0,services:0};old.qty+=l.qty;old.services++;map.set(l.id,old)}return [...map.values()].sort((a,b)=>b.qty-a.qty||alpha(a.name,b.name))}function analytics(){const u=usage(),max=Math.max(1,...u.map(x=>x.qty));return `<div class="twocol"><section class="section"><h2>Materiali più utilizzati</h2><p class="muted small">Classifica basata sulle quantità scaricate per servizio, senza nomi degli operatori.</p>${u.length?u.map((x,i)=>`<div class="orderline"><div class="row"><span><b>${i+1}. ${esc(x.name)}</b></span><span class="pill">${x.qty} utilizzati</span></div><div class="bar"><div style="width:${100*x.qty/max}%"></div></div><div class="muted small">Presente in ${x.services} registrazioni di scarico</div></div>`).join(''):'<div class="empty">Nessuno scarico registrato</div>'}</section><section class="section"><h2>Storico consumi</h2><p class="muted small">Registro delle quantità consumate, non degli operatori.</p>${db.history.length?db.history.map(h=>`<div class="accordion"><div class="accbtn"><div><b>${esc(h.service)}</b><div class="muted small">${esc(h.date)}</div></div><span class="tag">${h.lines.reduce((n,l)=>n+l.qty,0)} unità</span></div><div class="accbody">${h.lines.map(l=>`<div class="row orderline"><span>${esc(l.name)}</span><b>−${l.qty}</b></div>`).join('')}</div></div>`).join(''):'<div class="empty">Nessuno storico disponibile</div>'}</section></div>`}function management(){return `<section class="section"><h2>Gestione materiali</h2><p class="muted small">Aggiungi, modifica o elimina materiali dimostrativi. Le cancellazioni richiedono conferma.</p><button class="primary" onclick="addItem()">+ Aggiungi materiale</button><div class="tablewrap"><table><thead><tr><th>Materiale</th><th>Categoria</th><th>Giacenza</th><th>Azioni</th></tr></thead><tbody>${[...db.materials].sort(sortm).map(x=>`<tr><td>${esc(x.name)}<div class="muted small">${esc(x.color)} ${esc(x.variant)}</div></td><td>${esc(x.cat)}</td><td>${x.qty}</td><td><button class="mini" onclick="editItem('${x.id}')">Modifica</button> <button class="mini dangerbtn" onclick="removeItem('${x.id}')">Elimina</button></td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>Informazioni beta</h2><p>Questa versione è un prototipo locale con dati dimostrativi. Non richiede account, non legge Firebase e non sincronizza le modifiche tra dispositivi.</p><button onclick="exportData()">⬇ Salva copia dei dati demo</button></section>`}function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='padre_pio_beta_dati.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCsv(){const rows=db.materials.filter(x=>x.qty<x.min).map(x=>[x.cat,x.sub,x.name,x.color,x.variant,x.qty,x.min,db.orders[x.id]||'Da ordinare']);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[['Categoria','Sottocategoria','Materiale','Colore','Variante','Giacenza','Minimo','Stato'],...rows].map(r=>r.map(q).join(';')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='ordini_beta.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function render(){if(!$('nav'))return;$('nav').innerHTML=nav();$('main').innerHTML=({inventario:inventory,ordini:orders,servizi:service,statistiche:analytics,gestione:management}[tab])()}render();
</script></body></html>
